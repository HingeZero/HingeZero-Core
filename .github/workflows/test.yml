name: HingeZero Core Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install NumPy
        run: python -m pip install numpy

      - name: Run HingeZero deterministic test
        run: python test_hingezero.py


      - name: Run HingeZero associative recall test
        run: python test_associative_recall.py
